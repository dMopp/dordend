# rummage configuration: ~/.config/rummage/config.toml ($XDG_CONFIG_HOME/rummage/config.toml).
# Every key is optional; the values below are the defaults. A bad value is reported in the log
# and keeps its default. Check a file without starting rummage: rummage --check-config
# Created on first normal launch when no config exists; existing files are never replaced.
# rummage reads the file again when it changes: appearance, status bar, pointer, icons and
# keybindings at once; fonts at the next start.

[appearance]
# Background only (0-1); text, icons and thumbnails retain their original opacity.
# Transparency is disabled by default (1.0). Keep compositor window opacity at 1.0.
# Compositor blur can still be enabled.
background_opacity = 1.0

[status_bar]
# Text size in logical pixels (8-32); independent of list/sidebar zoom, applied live.
# The bar grows to fit larger text. Use 15 to match the large file-list text.
text_size = 12.0

[font]
# fontconfig pattern: a family name, optionally with properties ("Inter", "Inter:weight=medium").
family = "sans-serif"
# The same for text previews (Quick Look of text files).
monospace = "monospace"

[pointer]
# Two presses of the same button closer than this (milliseconds, 100-2000)...
double_click_ms = 400
# ...and closer than this (logical pixels, 0-50) make a double click.
double_click_distance = 4

[icon]
# "system" follows the desktop icon theme at startup (GTK/KDE/qt6ct settings).
# An installed theme name, e.g. "candy-icons", selects it explicitly; "builtin" uses Tabler.
# SVG and PNG icons are supported, with inherited themes and built-in fallbacks.
theme = "system"
# rummage's icon in the desktop's accent colour (Noctalia's colours, GNOME's or Plasma's accent):
# rummage writes it to ~/.local/share/icons/hicolor/scalable/apps/rummage.svg, where the dock and
# the launcher look first. false takes it away and leaves the installed icon.
follow_accent = true

# Optional icons for the Places sidebar; omitted keys keep their normal icons.
# Values are names from the selected icon theme, "builtin:<name>" for a bundled Tabler icon,
# or absolute paths to your own SVG/PNG files. Missing icons fall back to the normal icon.
# Bundled names are listed in third_party/tabler-icons/icons.txt (filled names use -filled).
# Changes reload live. Keys follow the folder's purpose even if you rename/move an XDG folder.
# trash applies to both states unless trash_full is also set. Theme names require a theme
# other than "builtin"; custom files and builtin:<name> work with any theme.
[icon.places]
# home = "user-home"
# desktop = "user-desktop"
# documents = "folder-documents"
# downloads = "folder-download"
# music = "folder-music"
# pictures = "/home/you/.local/share/icons/my-pictures.svg"
# videos = "folder-videos"
# filesystem = "drive-harddisk"
# trash = "builtin:trash"
# trash_full = "builtin:trash-filled"

[keybindings]
# Defaults are listed below as commented examples. Leave them commented to keep
# every built-in alternative; uncomment and edit only the actions you want to change.
# One chord per action replaces ALL its defaults. An empty string disables it.
# Changes reload live. F1 (or your show_shortcuts binding) shows active bindings.
# Modifiers: Ctrl, Shift, Alt, Super. Keys use case-insensitive XKB names:
# r, F2, Return, space, Left, Tab, plus (write Ctrl+plus, not Ctrl++).
# Letter names match both cases; Shift must be included when you want that modifier.

# Views and panels
# columns_view = "Ctrl+1"       # Columns; also Ctrl+keypad 1 by default
# grid_view = "Ctrl+2"          # Grid; also Ctrl+keypad 2 by default
# details_view = "Ctrl+3"       # Details; also Ctrl+keypad 3 by default
# quick_look = "space"          # Preview the focused file
# toggle_info = "Ctrl+i"        # Show/hide the info pane
# toggle_sidebar = "Ctrl+b"     # Show/hide the sidebar
# focus_sidebar = "F6"          # Move focus into/out of the sidebar
# toggle_hidden = "Ctrl+h"      # Show/hide hidden files
# add_bookmark = "Ctrl+d"       # Add the folder to the sidebar
# go_to = "Ctrl+l"              # Go to a folder or a server (smb://, sftp://)

# Commands and help
# command_palette = "Ctrl+k"   # Open the command palette
# filter_names = "Ctrl+Shift+f" # Filter names in the view
# find_files = "Ctrl+f"         # Find files under the folder
# show_shortcuts = "F1"         # Also ? by default (Shift is ignored)
# context_menu = "Menu"         # Also F10/Shift+F10 by default (Shift is ignored)
# properties = "Alt+Return"     # File/folder properties and folder icon selection
# open_terminal = "F4"          # Open in a terminal

# Folder history
# back = "Alt+Left"             # Previous location
# forward = "Alt+Right"         # Next location

# Selection
# select_all = "Ctrl+a"         # Select all files
# toggle_selection = "Ctrl+space" # Select/unselect the focused entry

# Panes (Tab switches only while browsing; dialogs and text fields keep Tab)
# toggle_split = "F3"           # Show two panes / active pane full-width
# switch_pane = "Tab"
# copy_other_pane = "Ctrl+F5"
# move_other_pane = "Ctrl+F6"
# These commands have no default shortcut; bind them if useful:
# swap_panes = "Ctrl+Shift+s"
# orient_panes = "Ctrl+Shift+F3"
# open_other_pane = "Ctrl+Shift+o"
# same_other_pane = "Ctrl+Shift+d"

# Tabs (within the active pane)
# new_tab = "Ctrl+t"
# close_tab = "Ctrl+w"
# next_tab = "Ctrl+Tab"
# previous_tab = "Ctrl+Shift+Tab"

# File operations
# rename = "F2"                 # Rename the focused file
# new_folder = "Ctrl+Shift+n"
# copy = "Ctrl+c"               # Copy selected files
# cut = "Ctrl+x"                # Cut selected files; Escape cancels the cut
# paste = "Ctrl+v"              # Paste into the current folder
# trash = "Delete"              # Also keypad Delete by default
# erase = "Shift+Delete"        # Permanent deletion; also Shift+keypad Delete
# undo = "Ctrl+z"
# redo = "Ctrl+Shift+z"

# Customization examples (replace the corresponding line above):
# rename = "Ctrl+r"
# select_all = "Ctrl+g"
# toggle_selection = "Ctrl+j"
# erase = ""                   # Disable the permanent-delete shortcut

# Fixed shortcuts (reference only; these are not configurable action names):
# Ctrl+q                  Quit
# Alt+1 ... Alt+9         Select a numbered tab
# Up/Down                Move between entries
# Left/Right             Move in the grid; parent/open in columns;
#                        collapse/expand in details
# Home/End, Page_Up/Page_Down  First/last entry, previous/next page
# Return                 Open the focused entry
# Alt+Down               Open in grid/details
# BackSpace, Alt+Up       Parent folder
# Shift+movement         Select a range
# Ctrl+movement          Move focus without changing selection
# Escape                 Collapse selection to one entry
# Ctrl+plus / Ctrl+minus  Zoom in/out (Ctrl+equal also zooms in)
# Ctrl+0                 Reset zoom
#
# While renaming: Return accepts, Escape cancels; Ctrl+Left/Right moves by word;
# Ctrl+z undoes, Ctrl+Shift+z redoes; Ctrl+v pastes text.
# Sidebar: Up/Down/Home/End chooses a place, Return opens, Escape returns to view.
# Quick Look: Escape closes; arrows browse files; Home/End and Page_Up/Page_Down
# scroll text; Ctrl+a selects text, Ctrl+c copies selected text.
# Name conflict dialog: R replaces, S skips, Return keeps both;
# A applies the choice to the rest, Escape stops.
# Permanent-delete confirmation: Return confirms, Escape cancels.
#
# Unknown actions, invalid chords or conflicts reject the whole binding set:
# defaults at startup, previous bindings on reload. Check before using:
# rummage --config ~/.config/rummage/config.example.toml --check-config

# Registry actions also accept bindings: copy_location, extract_here, extract_to,
# and "action:<id>" for any configured action. They have no default shortcut.
# copy_location = "Ctrl+Shift+c"
# Uncomment bindings only after enabling the corresponding action below.
# "action:compress" = "Ctrl+Alt+z"
# "action:file-goblin" = "Ctrl+Alt+g"
# Unknown actions, invalid chords or conflicting bindings reject the whole binding
# set: defaults at startup, previous bindings on reload. Use --check-config to check.

# Custom actions are opt-in: the commented examples below do not enable themselves, and
# updating rummage does not replace an existing config. Install the programs you want to use,
# then uncomment a complete [[actions]] block. These examples call programs directly.
# Give each action a unique id (letters, digits, _ or -); label is its visible menu text.
# Check with rummage --check-config. Valid changes reload live together with keybindings.
# Invalid definitions/bindings retain the previous set on reload.
#
# Actions appear under Actions in the right-click menu and directly in Ctrl+K when applicable.
# placement = "menu" puts an action directly above the Actions submenu; the default is
# placement = "actions". A [context_menu] layout below can instead arrange them into a tree.
# Custom menu actions follow config order. Add optional shortcuts in [keybindings] above;
# do not create a second [keybindings] section inside or after an action block.
#
# 1. A quick demo: select one or more files/folders and consult the goblin.
# Requires notify-send (usually provided by libnotify). No MIME filter: mixed types are OK.
# [[actions]]
# id = "file-goblin"
# label = "Consult the File Goblin"
# argv = ["notify-send", "The File Goblin has spoken", "A fine selection. Strong filenames. Subtle bytes. 9/10."]
# selection = "many"
#
# 2. Only show this for exactly one image. Requires the Switcheroo image converter.
# Replace the executable with your preferred image application if needed.
# [[actions]]
# id = "image-edit"
# label = "Edit Image"
# argv = ["switcheroo", "{file}"]
# mime = ["image/*"]
# selection = "one"
#
# 3. Compress one or more files/folders with 7-Zip, directly from the parent menu.
# Requires 7z (use "7zz" instead if that is your installed executable). rummage's save picker
# asks for the ZIP filename and destination, then passes the result directly to 7-Zip.
# -spd makes wildcard characters in selected filenames literal. No wrapper script is needed.
# [[actions]]
# id = "compress"
# label = "Compress to ZIP…"
# argv = ["7z", "a", "-tzip", "-spd", "{destination}", "--", "{files}"]
# selection = "many"
# placement = "menu"
# destination = "file"
# destination_name = "Archive.zip"
# notify_on_completion = true
#
# If your application already supplies a dialog, omit destination and destination_name.
# For example, with File Roller installed, use this argv instead:
# argv = ["file-roller", "--default-dir", "{directory}", "--add", "{files}"]
# File Roller's dialog chooses the name, destination and archive format.
#
# 4. Show the current folder in a notification when nothing is selected.
# Requires notify-send. Change selection to "any" to offer it with or without a selection.
# [[actions]]
# id = "folder-info"
# label = "Show Current Folder"
# argv = ["notify-send", "Current folder", "{directory}"]
# selection = "background"
#
# 5. Open a selected folder in the desktop's default file manager.
# Requires xdg-open (xdg-utils). This is offered for one folder, not for ordinary files.
# [[actions]]
# id = "open-folder"
# label = "Open Folder in Default Manager"
# argv = ["xdg-open", "{file}"]
# mime = ["inode/directory"]
# selection = "one"
#
# 6. Resize one image to a new file. Requires ImageMagick's magick executable.
# rummage asks where to save it; ImageMagick determines the format from the chosen extension.
# [[actions]]
# id = "resize-image"
# label = "Resize Image to Half Size…"
# argv = ["magick", "{file}", "-resize", "50%", "{destination}"]
# mime = ["image/*"]
# selection = "one"
# destination = "file"
# destination_name = "resized.png"
# notify_on_completion = true
#
# 7. Choose a destination folder for one or more files/folders. Requires GNU cp.
# cp performs this copy independently, so it is not part of rummage's Undo history.
# [[actions]]
# id = "copy-to"
# label = "Copy To…"
# argv = ["cp", "--archive", "--", "{files}", "{destination}"]
# selection = "many"
# destination = "directory"
# notify_on_completion = true
#
# Defaults: selection = "one", execution = "handoff", enabled = true, no MIME filter.
# No MIME filter allows all types, but does NOT enable multi-select: set selection = "many".
# Selection: "one" = exactly one item, "many" = one or more, "background" = no items,
# "any" = any number including none. Use "any" with a command needing no selected paths,
# or with {directory}; {file} and {files} are not allowed with "any" or "background".
# MIME filters accept exact types ("application/zip", "text/plain", "inode/directory") or
# type/* patterns ("image/*"). Every selected item must match at least one listed type.
# For a ZIP-only custom action, add mime = ["application/zip"]; a mixed ZIP/text selection
# then hides it. The built-in extract actions already filter for supported archive types.
# MIME matching uses rummage's detected type; it is not a filename-extension pattern.
# Placeholders must be whole arguments, after the program:
#   {file}: one absolute selected path (requires selection = "one")
#   {files}: separate absolute arguments (requires selection = "one" or "many")
#   {directory}: the current folder, also used as the process's working directory
#   {destination}: an absolute path chosen by rummage before starting the command
# destination = "file" asks for a save filename; "directory" asks for an existing folder.
# destination_name suggests a filename for "file" only (a literal name, without directories).
# The picker starts in the current folder and uses the action's label as its window title.
# Cancelling does not run the command. The selection stays as it was when the action started.
# Omit destination (or use "none") for commands that do not need a picker. A destination
# picker and {destination} must be configured together. These options apply to external actions.
# rummage does not create or modify the chosen path: the program owns output and conflicts.
# The save picker confirms existing files; 7z a updates an existing archive, whereas programs
# such as cp or magick may replace output. Choose a new filename to create a separate result.
# argv is an argument array: no globbing, tilde/environment expansion or shell interpretation
# is done. Do not add shell quotes around {file} or {files}; the array already preserves
# argument boundaries, including filenames with spaces and newlines.
# A handoff runs independently: the external application owns dialogs, progress and conflicts.
# notify_on_completion = true adds a desktop notification and status message when an external
# command exits: success for exit code 0, failure for other codes or signals. Default: false.
# rummage sends the notification itself; notify-send and wrapper scripts are not required.
# Cancelling a destination picker or failing to start a command does not send a completion
# notification. Launch failures still appear in the status bar. Keep rummage open to receive
# completion notifications. This follows the launched process: commands which hand work to
# another process or an already-running GUI may exit before that work has finished.
# A desktop notification service must be running; without one, the status message still works.
# Launch/exit failures appear in the status bar. rummage watches the resulting file changes;
# external operations are not added to Undo. Jobs and multi-step macros are not yet supported.
# Missing custom-action programs are dimmed in the menu and omitted from the palette. Programs
# are found on PATH, or you can supply an absolute executable path as the first argument.
# Add enabled = false to a block to disable it without deleting it.
#
# Built-in Copy Location copies selected paths as text (one per line), or the current folder
# on empty space. It cannot be replaced. Actions are not offered in the trash; external actions
# are also unavailable in file-picker mode.
# Extract Here and Extract To… automatically detect installed programs on PATH:
#   unrar for RAR, then 7zz/7z for ZIP/RAR/7z; otherwise file-roller, unzip (ZIP),
#   gzip (single .gz), tar (tar / compressed tar),
#   then 7zz or 7z for formats they support. gzip alone does not unpack .tar.gz contents.
#   7z can unpack compressed tar in two passes when tar is unavailable.
# File Roller owns its dialogs. CLI backends use rummage's folder picker for Extract To….
# CLI archives extract into a new archive-named folder; single compressed files become files.
# Existing output gets a numbered sibling instead of being overwritten; originals are retained.
# Keep rummage open until CLI extraction finishes. Failed/interrupted output stays in a visible
# '(extracting)' folder. The 7zz/7z and unrar backends prompt for passwords (including encrypted headers);
# cancelling creates no output. Other CLI backends do not prompt; use Open With for encryption.
# All archive programs are optional; none is installed automatically. Missing archive tools
# show "setup required"; invoking extraction explains what to install. Archive failures remain
# in a scrollable dialog with Copy Details, diagnostics and any retained output location.
# Presets default to placement = "menu"; use "actions" to move extraction into the submenu.
# Override a preset by ID; unspecified fields retain the preset's defaults. Setting argv opts
# out of automatic backend selection and makes the preset an ordinary external handoff:
# (To restore automatic selection, remove argv or remove the override.)
# [[actions]]
# id = "extract_here"
# label = "Extract Here"
# argv = ["/absolute/path/to/my-extractor", "{files}"]
#
# Or disable either preset:
# [[actions]]
# id = "extract_to"
# enabled = false

# Default context-menu layouts, written out for editing.
# rummage builds these menus automatically when [context_menu] is absent. Leave the
# reference commented to follow future defaults, or uncomment [context_menu] and the
# complete arrays you want to customize. Use only one [context_menu] table per file.
# These arrays preserve the current default order, separators and built-in submenus.
# Availability still depends on the selection, folder, device and installed programs;
# listing an ID does not force an inapplicable item to appear or an unavailable item to run.
# No common "items" array is set by default: entry, background, trash and sidebar each
# have their own menu. A missing override uses items if present, otherwise its built-in menu.
#
# [context_menu]
#
# Files/folders: right-click an entry or the current selection.
# open_tab and add_bookmark apply to folders; open_terminal needs a folder and terminal.
# Open With keeps its dynamically discovered applications. Paste may be disabled when
# the clipboard is empty; Rename and Properties are disabled for a multiple selection.
# entry = [
#   { id = "open" },
#   { id = "open_with" },
#   { id = "open_tab" },
#   { id = "open_terminal" },
#   { id = "add_bookmark" },
#   { id = "copy", separator = true },
#   { id = "cut" },
#   { id = "paste" },
#   { id = "rename", separator = true },
#   { id = "trash" },
#   { id = "erase" },
#   { id = "properties", separator = true },
#   { id = "action:copy_location" },
#   { id = "action:extract_here" },
#   { id = "action:extract_to" },
#   { remaining = true },
#   { id = "actions" },
#   { id = "sort", separator = true },
# ]
#
# Empty space in an ordinary folder, with no entry targeted.
# New File keeps Empty File and the dynamically discovered templates.
# background = [
#   { id = "new_folder" },
#   { id = "new_file" },
#   { id = "paste", separator = true },
#   { id = "add_bookmark", separator = true },
#   { id = "open_terminal" },
#   { id = "action:copy_location" },
#   { remaining = true },
#   { id = "actions" },
#   { id = "sort", separator = true },
#   { id = "properties", separator = true },
# ]
#
# Trash entries show Restore, Delete Permanently and read-only Properties; empty space shows Empty Trash.
# These are alternative contexts, so all three never appear together.
# trash = [
#   { id = "restore" },
#   { id = "erase", separator = true },
#   { id = "properties", separator = true },
#   { id = "empty_trash" },
# ]
#
# Sidebar: devices show Mount/Unmount and, when supported, Eject; bookmarks show
# Remove from Sidebar; Trash shows Empty Trash. Other places have no context menu.
# Mount/Unmount are enabled according to the device's mounted state.
# sidebar = [
#   { id = "mount" },
#   { id = "unmount" },
#   { id = "eject", separator = true },
#   { id = "remove_bookmark" },
#   { id = "empty_trash" },
# ]
#
# Default submenu contents (retained when you reference the parent ID above):
#   open_with  Open With: dynamically discovered applications for the selection.
#   new_file   New File: empty_file (Empty File), then a separator and template entries.
#   actions    Actions: applicable custom actions with placement = "actions", in config order.
#   sort       Sort By: sort:name (Name), sort:size (Size), sort:modified (Modified),
#              sort:type (Type), a separator, sort:ascending (Ascending),
#              sort:descending (Descending). The current key and direction are checked.
# Actions disappears when empty. The default registry puts Copy Location, Extract Here
# and Extract To at the top level; extraction only appears for applicable archive selections.
# { remaining = true } above keeps other applicable top-level actions (placement = "menu")
# before Actions, including the Compress example. The actions reference keeps submenu actions.
# Explicit action references take precedence over their placement setting.
# To move a submenu child, reference its ID in a new group; it is removed from its old group.
# Keep open_with/new_file as parent references to retain their dynamically loaded contents.

# Custom context-menu layout (alternative to the default layouts above).
# References use menu IDs, including "action:<id>" for built-in or custom actions.
# Use this alternative instead of the default arrays, or adapt selected groups into them.
# Specific entry/background/trash/sidebar arrays override items, so remove those overrides
# if you want this common items layout to apply to every context.
# Enable the compress, file-goblin, folder-info and image-edit examples above before
# enabling this layout, or remove their references. Every referenced action ID must exist.
# Groups have a label and nested items; nest as many levels as needed. Entries appear in
# list order. Inapplicable actions and empty groups disappear; missing programs stay dimmed.
# { remaining = true } inserts everything you haven't placed explicitly, in its default
# grouping. Use it at most once per layout, at any depth. Omit it to hide unlisted items.
# { separator = true } inserts a dividing line (leading/trailing/empty lines are omitted).
# Add label = "…" to an id entry to rename it, and separator = true for a line above it.
# Dynamic groups such as open_with and new_file keep loading their contents when nested.
# These layouts override action placement for the context menu; Ctrl+K and shortcuts remain
# available independently. Invalid layouts retain the previous menus/actions/keys on reload.
#
# [context_menu]
# items = [
#   { id = "open" },
#   { id = "open_with" },
#   { id = "action:compress" },
#   { label = "My Actions", items = [
#     { label = "Information", items = [
#       { id = "action:file-goblin" },
#       { id = "action:folder-info" },
#     ] },
#     { label = "External", items = [ { id = "action:image-edit" } ] },
#   ] },
#   { label = "Archives", items = [
#     { id = "action:extract_here" },
#     { id = "action:extract_to" },
#   ] },
#   { separator = true },
#   { remaining = true },
# ]
#
# Archives appears only when extraction applies; it disappears for non-archive selections.
# Moving actions into groups does not change their MIME or selection rules.
#
# items is the common layout. Override individual contexts with entry, background, trash,
# or sidebar arrays using exactly the same syntax. Missing overrides use items, or the
# built-in layout if items is absent. An empty array hides that context menu completely.
# background = [
#   { label = "Create", items = [ { id = "new_folder" }, { id = "new_file" } ] },
#   { remaining = true },
# ]
#
# Built-in IDs (only shown where applicable):
# open, open_with, open_tab, open_terminal, add_bookmark, copy, cut, paste, rename, trash,
# erase, restore, empty_trash, properties, new_folder, new_file, empty_file, sort, sort:name, sort:size,
# sort:modified, sort:type, sort:ascending, sort:descending, actions,
# panes, toggle_split, switch_pane, swap_panes, orient_panes, open_other_pane,
# same_other_pane, copy_other_pane, move_other_pane,
# action:copy_location, action:extract_here, action:extract_to,
# mount, unmount, eject, remove_bookmark.
# open_with and new_file include their dynamically discovered applications/templates;
# sort and actions include their remaining children. Each ID may appear once per layout.
