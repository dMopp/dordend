name: Build, test and package

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Let main finish publishing before another main run can replace its assets.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  nix:
    name: Nix build, tests and installed package
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31
      - name: Lint workflow and package scripts
        run: |
          nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck --command \
            bash -c 'actionlint .github/workflows/ci.yml && shellcheck -x scripts/ci/*.sh'
      - name: Test development download preparation and publishing
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Run all x86_64-linux flake checks
        run: nix flake check --print-build-logs
      - name: Build the installable package
        run: nix build --print-build-logs

  void:
    name: Void glibc package and clean install
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build exact checkout and test in a fresh Void container
        env:
          CI_JOBS: 2
          PACKAGE_OUTPUT: ${{ runner.temp }}/void-package
        run: |
          set -o pipefail
          bash scripts/ci/void.sh "$PACKAGE_OUTPUT" 2>&1 | tee "$RUNNER_TEMP/void-package.log"
      - name: Save package, source identity and build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: void-x86_64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/void-package/packages/
            ${{ runner.temp }}/void-package/template
            ${{ runner.temp }}/void-package/source.json
            ${{ runner.temp }}/void-package.log
          retention-days: 14
          if-no-files-found: error

  native:
    name: ${{ matrix.distro }} package and clean install
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - format: deb
            distro: Debian 13
          - format: rpm
            distro: Fedora 44
          - format: arch
            distro: Arch Linux
          - format: tumbleweed
            distro: openSUSE Tumbleweed
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build exact checkout and test in a fresh distro container
        env:
          CI_JOBS: 2
          PACKAGE_FORMAT: ${{ matrix.format }}
          PACKAGE_OUTPUT: ${{ runner.temp }}/native-package
        run: |
          set -o pipefail
          bash scripts/ci/native.sh "$PACKAGE_FORMAT" "$PACKAGE_OUTPUT" 2>&1 | tee "$RUNNER_TEMP/native-package.log"
      - name: Save packages, recipes, source identity and build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.format }}-x86_64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/native-package/packages/
            ${{ runner.temp }}/native-package/recipe/
            ${{ runner.temp }}/native-package/debian-source/
            ${{ runner.temp }}/native-package/rummage.spec
            ${{ runner.temp }}/native-package/input/
            ${{ runner.temp }}/native-package.log
          retention-days: 14
          if-no-files-found: error

  downloads:
    name: Prepare development downloads
    needs: [nix, void, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: '*-x86_64-${{ github.sha }}'
          path: ${{ runner.temp }}/package-artifacts
      - name: Prepare checked packages and instructions
        run: |
          python3 scripts/ci/prepare-downloads.py "$RUNNER_TEMP/package-artifacts" "$RUNNER_TEMP/downloads" \
            --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --run-id "$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: development-downloads-${{ github.sha }}
          path: ${{ runner.temp }}/downloads/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish development downloads
    needs: downloads
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: development-downloads-${{ github.sha }}
          path: ${{ runner.temp }}/downloads
      - name: Update rolling development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/ci/publish-downloads.sh "$RUNNER_TEMP/downloads" "$GITHUB_SHA"
