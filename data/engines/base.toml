# The base engine (ROADMAP 2, 3): photos, pictures, camera raw files and text files, read by
# rummage-preview in its cage. Installed in share/rummage/engines/; rummage reads every manifest
# there at start-up (src/engines/include/rummage/engines/engines.hpp says what each key means).

[engine]
name = "base"
program = "rummage-preview"
protocol = 4

[[family]]
name = "image"
shows = "picture"
info = true
thumbnails = true
mime = [
    "image/png",
    "image/jpeg",
    "image/gif",
    "image/webp",
    "image/jxl",
    "image/tiff",
    "image/x-adobe-dng",
    "image/x-canon-cr2",
    "image/x-canon-cr3",
    "image/x-canon-crw",
    "image/x-dcraw",
    "image/x-fuji-raf",
    "image/x-kodak-dcr",
    "image/x-kodak-k25",
    "image/x-kodak-kdc",
    "image/x-minolta-mrw",
    "image/x-nikon-nef",
    "image/x-nikon-nrw",
    "image/x-olympus-orf",
    "image/x-panasonic-raw",
    "image/x-panasonic-raw2",
    "image/x-panasonic-rw",
    "image/x-panasonic-rw2",
    "image/x-pentax-pef",
    "image/x-portable-graymap",
    "image/x-portable-pixmap",
    "image/x-sigma-x3f",
    "image/x-sony-arw",
    "image/x-sony-sr2",
    "image/x-sony-srf",
]

[[family]]
name = "text"
shows = "text"
subclasses = true
mime = ["text/plain"]
